<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Agendamento</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="painel-municipal">
    
    <!-- BARRA DE ACESSIBILIDADE GOVERNAMENTAL -->
    <div class="barra-acessibilidade">
        <div class="conteudo-acessibilidade">
            <span>Quadra Democrática - Projeto Integrador II</span>
            <div class="botoes-acessibilidade">
                <button type="button" id="btn-aumentar-fonte" aria-label="Aumentar tamanho do texto">A+</button>
                <button type="button" id="btn-diminuir-fonte" aria-label="Diminuir tamanho do texto">A-</button>
                <button type="button" id="btn-alto-contraste" aria-label="Ativar Alto Contraste">Alto Contraste</button>
            </div>
        </div>
    </div>

    <main class="container painel-container">
        <header class="painel-cabecalho">
            <div>
            <h1>Agendamentos</h1>
            <p>Reserva de Quadras Comunitárias</p>
            </div>
            <button id="btn-sair" class="btn-link">Voltar ao Login</button>
        </header>

        <div class="banner-municipal">
            <img src="/assets/branding/banner-potim.png" width="2804" height="561" alt="Quadra Democrática — Agende quadras públicas com facilidade. Prefeitura de Potim, SP." fetchpriority="high">
        </div>

        <div id="mensagem-status" aria-live="polite" class="status-escondido"></div>

        <section id="sessao-quadras" class="secao-quadras">
            <h2>Quadras Disponíveis</h2>
            <div id="lista-quadras">
                Carregando dados públicos...
            </div>
        </section>

        <section id="sessao-agendar" class="secao-reserva">
            <h2>Solicitação de Reserva</h2>
            <form id="form-agendamento">
                <div class="grupo-input">
                    <label for="select-quadra">Espaço Público</label>
                    <select id="select-quadra" required aria-required="true">
                        <option value="">Aguardando seleção...</option>
                    </select>
                </div>
                
                <div class="grupo-input">
                    <label for="data-agendamento">Data de Utilização</label>
                    <input type="date" id="data-agendamento" required aria-required="true">
                </div>

                <div id="container-horarios-ocupados" class="escondido" style="margin-bottom: 1.2rem; padding: 1rem; background-color: var(--input-bg); border: 2px dashed var(--error-color);">
                    <h3 style="font-size: 1rem; margin-bottom: 0.5rem; color: var(--error-color);">Horários já reservados neste dia:</h3>
                    <ul id="lista-horarios-ocupados" style="list-style-type: none; font-size: 0.9rem;">
                        <!-- Injetado via JS -->
                    </ul>
                </div>

                <div class="linha-dupla">
                    <div class="grupo-input metade">
                        <label for="hora-inicio">Início da Utilização</label>
                        <select id="hora-inicio" required aria-required="true" aria-describedby="ajuda-horarios"><option value="">Selecione o horário</option><option value="06:00">06:00</option><option value="06:30">06:30</option><option value="07:00">07:00</option><option value="07:30">07:30</option><option value="08:00">08:00</option><option value="08:30">08:30</option><option value="09:00">09:00</option><option value="09:30">09:30</option><option value="10:00">10:00</option><option value="10:30">10:30</option><option value="11:00">11:00</option><option value="11:30">11:30</option><option value="12:00">12:00</option><option value="12:30">12:30</option><option value="13:00">13:00</option><option value="13:30">13:30</option><option value="14:00">14:00</option><option value="14:30">14:30</option><option value="15:00">15:00</option><option value="15:30">15:30</option><option value="16:00">16:00</option><option value="16:30">16:30</option><option value="17:00">17:00</option><option value="17:30">17:30</option><option value="18:00">18:00</option><option value="18:30">18:30</option><option value="19:00">19:00</option><option value="19:30">19:30</option><option value="20:00">20:00</option><option value="20:30">20:30</option><option value="21:00">21:00</option><option value="21:30">21:30</option><option value="22:00">22:00</option><option value="22:30">22:30</option><option value="23:00">23:00</option></select>
                    </div>
                    <div class="grupo-input metade">
                        <label for="hora-fim">Término da Utilização</label>
                        <select id="hora-fim" required aria-required="true" aria-describedby="ajuda-horarios"><option value="">Selecione o horário</option><option value="06:30">06:30</option><option value="07:00">07:00</option><option value="07:30">07:30</option><option value="08:00">08:00</option><option value="08:30">08:30</option><option value="09:00">09:00</option><option value="09:30">09:30</option><option value="10:00">10:00</option><option value="10:30">10:30</option><option value="11:00">11:00</option><option value="11:30">11:30</option><option value="12:00">12:00</option><option value="12:30">12:30</option><option value="13:00">13:00</option><option value="13:30">13:30</option><option value="14:00">14:00</option><option value="14:30">14:30</option><option value="15:00">15:00</option><option value="15:30">15:30</option><option value="16:00">16:00</option><option value="16:30">16:30</option><option value="17:00">17:00</option><option value="17:30">17:30</option><option value="18:00">18:00</option><option value="18:30">18:30</option><option value="19:00">19:00</option><option value="19:30">19:30</option><option value="20:00">20:00</option><option value="20:30">20:30</option><option value="21:00">21:00</option><option value="21:30">21:30</option><option value="22:00">22:00</option><option value="22:30">22:30</option><option value="23:00">23:00</option><option value="23:30">23:30</option></select>
                    </div>
                </div>
                
                <p id="ajuda-horarios" class="ajuda-horarios">Escolha os horários na lista. A reserva deve durar de 30 minutos a 2 horas.</p>
                <button type="submit" class="btn-primario">Confirmar Solicitação</button>
            </form>
        </section>
    </main>

    <script src="/assets/acessibilidade.js"></script>
    <script src="/assets/dashboard.js"></script>
</body>
</html>
