<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Cidadão - QuadraLivre Potim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- BARRA DE ACESSIBILIDADE GOVERNAMENTAL -->
    <div class="barra-acessibilidade">
        <div class="conteudo-acessibilidade">
            <span>PJ II - Potim/SP</span>
            <div class="botoes-acessibilidade">
                <button type="button" id="btn-aumentar-fonte" aria-label="Aumentar tamanho do texto">A+</button>
                <button type="button" id="btn-diminuir-fonte" aria-label="Diminuir tamanho do texto">A-</button>
                <button type="button" id="btn-alto-contraste" aria-label="Ativar Alto Contraste">Alto Contraste</button>
            </div>
        </div>
    </div>

    <main class="container">
        <header>
            <h1>PROJETO QUADRA LIVRE</h1>
            <p>Agendamento de Espaços Públicos</p>
        </header>

        <div id="mensagem-status" aria-live="polite" class="status-escondido"></div>

        <section id="sessao-login">
            <h2>Acesso ao Sistema</h2>
            <form id="form-login">
                <div class="grupo-input">
                    <label for="login-email">E-mail do Usuário</label>
                    <input type="email" id="login-email" name="username" required aria-required="true">
                </div>
                <div class="grupo-input">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" name="password" required aria-required="true">
                </div>
                <button type="submit" class="btn-primario">Entrar</button>
            </form>
            <p style="margin-top: 1rem; text-align: center;">Primeiro acesso? <button type="button" id="btn-mostrar-cadastro" class="btn-link">Cadastre-se</button></p>
        </section>

        <section id="sessao-cadastro" class="escondido">
            <h2>Cadastro</h2>
            <form id="form-cadastro">
                <div class="grupo-input">
                    <label for="cadastro-nome">Nome Completo</label>
                    <input type="text" id="cadastro-nome" required aria-required="true">
                </div>
                <div class="grupo-input">
                    <label for="cadastro-email">E-mail</label>
                    <input type="email" id="cadastro-email" required aria-required="true">
                </div>
                <div class="grupo-input">
                    <label for="cadastro-senha">Senha</label>
                    <input type="password" id="cadastro-senha" required aria-required="true">
                </div>
                <button type="submit" class="btn-primario">Registrar</button>
            </form>
            <p style="margin-top: 1rem; text-align: center;"><button type="button" id="btn-mostrar-login" class="btn-link">Voltar ao Login</button></p>
        </section>
    </main>

    <script src="acessibilidade.js"></script>
    <script src="app.js"></script>
</body>
</html>
