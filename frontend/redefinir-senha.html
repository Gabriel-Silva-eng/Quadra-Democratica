<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha - Quadra Democrática Potim</title>
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="painel-municipal pagina-acesso">
    
    <!-- BARRA DE ACESSIBILIDADE GOVERNAMENTAL -->
    <div class="barra-acessibilidade">
        <div class="conteudo-acessibilidade">
            <span>Quadra Democrática - Projeto Integrador II</span>
            <div class="botoes-acessibilidade">
                <button type="button" id="btn-aumentar-fonte" aria-label="Aumentar tamanho do texto">A+</button>
                <button type="button" id="btn-diminuir-fonte" aria-label="Diminuir tamanho do texto">A-</button>
                <button type="button" id="btn-alto-contraste" aria-label="Ativar Alto Contraste">Alto Contraste</button>
            </div>
        </div>
    </div>

    <main class="acesso-container">
        <div class="banner-municipal">
            <img src="/assets/branding/banner-potim.png" width="2804" height="561" alt="Quadra Democrática — Agende quadras públicas com facilidade. Prefeitura de Potim, SP." fetchpriority="high">
        </div>
        <div class="acesso-cartao">
            <header><h1>Escolha uma nova senha</h1><p>Recupere o acesso à sua conta na Quadra Democrática.</p></header>
            <div id="mensagem-status" aria-live="polite" class="status-escondido"></div>
            <form id="form-redefinir">
                <div class="grupo-input">
                    <label for="nova-senha">Nova senha</label>
                    <input type="password" id="nova-senha" autocomplete="new-password" minlength="8" aria-describedby="ajuda-senha" required>
                </div>
                <p id="ajuda-senha" class="ajuda-recuperacao">Use pelo menos 8 caracteres.</p>
                <div class="grupo-input">
                    <label for="confirmar-senha">Confirme a nova senha</label>
                    <input type="password" id="confirmar-senha" autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit" id="btn-salvar-senha" class="btn-primario">Salvar nova senha</button>
            </form>
            <p class="link-recuperacao"><a class="btn-link" href="/index.html">Voltar ao Login</a></p>
        </div>
    </main>

    <script src="/assets/acessibilidade.js"></script>
    <script src="/assets/redefinir-senha.js"></script>
</body>
</html>
