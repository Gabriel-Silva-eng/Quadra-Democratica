services:
  - type: web
    name: quadra-democratica
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: TZ
        value: America/Sao_Paulo
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quadra-democratica-db
          property: connectionString
      - key: ADMIN_EMAILS
        sync: false
databases:
  - name: quadra-democratica-db
    plan: free
    databaseName: quadra
    user: quadra
